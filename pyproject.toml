[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "async-es"
version = "0.1.0.dev0"
description = "Natural bounded-staleness evolution strategies for stateful LLM agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Academic-Public-License"
license-files = ["LICENSE.txt"]
authors = [
  { name = "William Hoy", email = "wjh58@miami.edu" },
  { name = "Jingxuan Fan", email = "jfan@g.harvard.edu" },
  { name = "Nurcin Celik", email = "celik@miami.edu" },
  { name = "Xu Pan", email = "xupan@fas.harvard.edu" },
]
dependencies = [
  "huggingface-hub>=1.20,<2",
  "numpy>=2.1,<3",
  "pyarrow>=22",
  "ray>=2.53,<3",
  "torch>=2.11,<3",
  "transformers>=5.12,<6",
  "vllm>=0.22,<0.24",
  "wandb>=0.23,<1",
]

[project.urls]
Repository = "https://github.com/Bhoy1/async-es"

[project.scripts]
async-es = "train:main"

[tool.setuptools]
py-modules = [
  "train",
  "async_es_coordinator",
  "distributed_utils",
  "task_adapter",
  "weight_update_utils",
]

[tool.setuptools.packages.find]
include = ["tasks*"]

[tool.setuptools.package-data]
"tasks.endless_terminals" = ["splits/*.txt"]
