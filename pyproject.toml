[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "async-es"
version = "0.1.0.dev0"
description = "Natural bounded-staleness evolution strategies for stateful LLM agents"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.6,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "ray[default]>=2.48,<3",
  "torch>=2.10",
  "transformers>=4.56,<5",
  "vllm>=0.22,<0.24",
  "wandb>=0.21,<1",
]

[project.scripts]
async-es-endless = "train:main"

[tool.setuptools]
py-modules = [
  "train",
  "async_es_coordinator",
  "distributed_utils",
  "task_adapter",
  "token_entropy_utils",
  "weight_update_utils",
]

[tool.setuptools.packages.find]
include = ["tasks*"]
